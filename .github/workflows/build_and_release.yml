name: Build and Release Nexus AI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Dependências de Build
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pywebview psutil flask flask-cors pythonnet clr-loader requests tqdm

    - name: Testar proteção do atualizador e distribuição
      run: |
        python -m unittest discover -s tests -p test_updates.py
        python -m unittest discover -s tests -p test_distribution.py
        python -m unittest discover -s tests -p test_release_preparation.py
        python -m unittest discover -s tests -p test_release_assistant.py
        python -m unittest discover -s tests -p test_setup_support.py

    - name: Validar dependencias em ambiente limpo sem modelos
      timeout-minutes: 30
      shell: pwsh
      run: |
        $setupTestRoot = Join-Path $env:RUNNER_TEMP "phoenix-clean-setup"
        python -m venv $setupTestRoot
        if ($LASTEXITCODE -ne 0) { throw "Falha ao criar ambiente de teste" }
        $setupTestPython = Join-Path $setupTestRoot "Scripts/python.exe"
        & $setupTestPython -m pip install --upgrade pip
        if ($LASTEXITCODE -ne 0) { throw "Falha no pip de teste" }
        & $setupTestPython -m pip install -r requirements.txt
        if ($LASTEXITCODE -ne 0) { throw "Dependencias nao instalaram em ambiente limpo" }
        & $setupTestPython -m pip check
        if ($LASTEXITCODE -ne 0) { throw "Dependencias incompativeis" }
        & $setupTestPython -c "import torch, transformers, faster_whisper, qwen_tts, faster_qwen3_tts, pyannote.audio; print('Imports dos motores OK; nenhum modelo carregado')"
        if ($LASTEXITCODE -ne 0) { throw "Falha nas importacoes dos motores" }

    - name: Gerar Executável do Aplicativo Principal (Nexus AI Pro)
      run: python nexus/build_tools/build_main_app.py

    - name: Gerar Executável do Instalador (Setup Nexus)
      run: python nexus/build_tools/build_setup.py

    - name: Testar executáveis fora do checkout
      shell: pwsh
      run: |
        $smokeRoot = Join-Path $env:RUNNER_TEMP "phoenix-smoke"
        New-Item -ItemType Directory -Force -Path $smokeRoot | Out-Null
        Copy-Item -LiteralPath "dist/Nexus_AI_Pro.exe" -Destination $smokeRoot
        Copy-Item -LiteralPath "dist/Setup_Nexus.exe" -Destination $smokeRoot
        $env:TEST_IMPORTS="1"
        foreach ($item in @(@("Nexus_AI_Pro.exe", "import_test_main_ok.txt"), @("Setup_Nexus.exe", "import_test_setup_ok.txt"))) {
          $proc = Start-Process -FilePath (Join-Path $smokeRoot $item[0]) -WorkingDirectory $smokeRoot -WindowStyle Hidden -PassThru
          if (!$proc.WaitForExit(60000)) { $proc.Kill(); throw "Timeout no teste de $($item[0])" }
          if ($proc.ExitCode -ne 0 -or !(Test-Path (Join-Path $smokeRoot $item[1]))) { throw "Falha no teste de $($item[0])" }
        }
        if (!(Test-Path (Join-Path $smokeRoot "nexus/client/js/hub_updates.js"))) { throw "Interface ausente no pacote" }
        if (!(Test-Path (Join-Path $smokeRoot "nexus/correction_worker.py"))) { throw "Motor de correção ausente" }
        Remove-Item Env:TEST_IMPORTS

    - name: Gerar pacote de atualização automática
      run: python nexus/build_tools/build_update_package.py

    - name: Guardar instaladores validados
      uses: actions/upload-artifact@v4
      with:
        name: phoenix-installers
        path: |
          dist/Setup_Nexus.exe
          dist/Nexus_AI_Pro.exe
          dist/PhoenixDub_Update.zip
        if-no-files-found: error

    - name: Criar Release e Upload dos Executáveis
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        name: PhoenixDub AI ${{ github.ref_name }}
        draft: false
        prerelease: false
        body_path: RELEASE_NOTES.md
        files: |
          dist/Setup_Nexus.exe
          dist/Nexus_AI_Pro.exe
          dist/PhoenixDub_Update.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
